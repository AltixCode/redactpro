appId: com.altixcode.redactpro
name: Redact a statement end to end
---
# Verifies the whole chain against a fixture with known values: text
# recognition, pattern matching, box placement, and the burn-in that the
# previous implementation skipped entirely.
#
# Selectors are wrapped in .* because iOS composes one accessibility label per
# pressable from all of its child Text nodes, so an exact title never matches.
# They are also anchored on button copy rather than loose words: matching
# ".*Export.*" silently hit the "Preserved in export" row of the entity list and
# toggled that entity instead of advancing.
- launchApp:
    clearState: false
# A debug build launches through its dev-client deep link, so iOS raises an
# "Open in ..." confirmation that sits above the app and hides the accessibility
# tree beneath it. Release builds do not show this.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Cancel"
- assertVisible: "Permanent PII Blackout"
- takeScreenshot: artifacts/01-home

- tapOn: ".*Import Screenshot or Photo.*"
- extendedWaitUntil:
    visible: ".*(Recents|Photos|All Photos|Library).*"
    timeout: 25000

# Select the fixture by its accessibility label rather than a coordinate: the
# picker grid starts below the segmented control, and a percentage tap that
# looks correct on screen lands in the header. The pattern matches a single
# cell ("Photo, <date>, <time>") and not the grid container, whose label is
# every cell's label concatenated.
- tapOn:
    text: "Photo, [^,]+, [^,]+"
    index: 0

- extendedWaitUntil:
    visible: ".*Review Redactions.*"
    timeout: 60000
# The fixture plants exactly one of each; anything missing is a detector
# regression, not a flaky selector.
- assertVisible: ".*EMAIL.*"
- assertVisible: ".*PHONE.*"
- assertVisible: ".*CARD.*"
- assertVisible: ".*IBAN.*"
- takeScreenshot: artifacts/02-detected

- scrollUntilVisible:
    element:
      text: ".*Burn & Flatten.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Burn & Flatten.*"

- extendedWaitUntil:
    visible: ".*Share Redacted Image.*"
    timeout: 60000
- takeScreenshot: artifacts/03-exported

# Save to the camera roll so the written file can be pulled off the simulator
# and inspected. The on-screen preview is not proof: the defect this app
# shipped with was an export path that ignored its redactions entirely while
# the preview looked correct.
- tapOn: ".*(Save to Camera Roll|Save to Photos).*"
- extendedWaitUntil:
    visible: ".*OK.*"
    timeout: 30000
- tapOn: ".*OK.*"
- takeScreenshot: artifacts/04-saved
